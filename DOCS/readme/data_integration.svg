<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">Data Integration</text>
  <text x="222" y="42" font-size="15" fill="#64748b">how CRM and ERP tables join</text>

  <!-- system groups -->
  <rect x="20" y="70" width="560" height="380" rx="14" fill="#f3f7ff" stroke="#3b6fd8" stroke-dasharray="6 4"/>
  <text x="40" y="98" font-size="16" font-weight="700" fill="#1e3a8a">CRM · Customer Relationship Management</text>
  <rect x="680" y="70" width="300" height="380" rx="14" fill="#fffaeb" stroke="#c9a227" stroke-dasharray="6 4"/>
  <text x="700" y="98" font-size="16" font-weight="700" fill="#8a6d00">ERP · Resource Planning</text>

  <!-- table template: header, key rows -->
  <g font-size="14" fill="#1f2937">
    <!-- crm_sales_details -->
    <rect x="45" y="200" width="190" height="104" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
    <rect x="45" y="200" width="190" height="32" rx="8" fill="#dbe7ff"/>
    <text x="140" y="221" text-anchor="middle" font-weight="700">crm_sales_details</text>
    <text x="60" y="257">sls_prd_key</text>
    <text x="60" y="287">sls_cust_id</text>
    <text x="140" y="324" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">SALES</text>

    <!-- crm_prd_info -->
    <rect x="345" y="125" width="190" height="104" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
    <rect x="345" y="125" width="190" height="32" rx="8" fill="#dbe7ff"/>
    <text x="440" y="146" text-anchor="middle" font-weight="700">crm_prd_info</text>
    <text x="360" y="182">prd_key</text>
    <text x="360" y="212">cat_id</text>
    <text x="440" y="249" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">PRODUCT</text>

    <!-- crm_cust_info -->
    <rect x="345" y="290" width="190" height="104" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
    <rect x="345" y="290" width="190" height="32" rx="8" fill="#dbe7ff"/>
    <text x="440" y="311" text-anchor="middle" font-weight="700">crm_cust_info</text>
    <text x="360" y="347">cst_id</text>
    <text x="360" y="377">cst_key</text>
    <text x="440" y="414" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">CUSTOMER</text>

    <!-- erp_px_cat_g1v2 -->
    <rect x="735" y="135" width="190" height="74" rx="8" fill="#ffffff" stroke="#c9a227"/>
    <rect x="735" y="135" width="190" height="32" rx="8" fill="#fdf0c4"/>
    <text x="830" y="156" text-anchor="middle" font-weight="700">erp_px_cat_g1v2</text>
    <text x="750" y="192">id</text>
    <text x="830" y="229" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">PRODUCT CATEGORY</text>

    <!-- erp_cust_az12 -->
    <rect x="735" y="255" width="190" height="74" rx="8" fill="#ffffff" stroke="#c9a227"/>
    <rect x="735" y="255" width="190" height="32" rx="8" fill="#fdf0c4"/>
    <text x="830" y="276" text-anchor="middle" font-weight="700">erp_cust_az12</text>
    <text x="750" y="312">cid</text>

    <!-- erp_loc_a101 -->
    <rect x="735" y="350" width="190" height="74" rx="8" fill="#ffffff" stroke="#c9a227"/>
    <rect x="735" y="350" width="190" height="32" rx="8" fill="#fdf0c4"/>
    <text x="830" y="371" text-anchor="middle" font-weight="700">erp_loc_a101</text>
    <text x="750" y="407">cid</text>
    <text x="830" y="442" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">CUSTOMER · birthdate, gender, country</text>
  </g>

  <!-- join lines -->
  <g fill="none" stroke-width="1.8">
    <path d="M235,252 H290 V177 H345" stroke="#dc2626"/>
    <path d="M235,282 H290 V342 H345" stroke="#059669"/>
    <path d="M535,207 H635 V187 H735" stroke="#dc2626"/>
    <path d="M535,372 H635 V307 H735" stroke="#059669"/>
    <path d="M635,372 V402 H735" stroke="#059669"/>
  </g>
  <g font-size="11" fill="#475569">
    <text x="296" y="198">prd_key</text>
    <text x="296" y="320">cust_id</text>
    <text x="565" y="198">cat_id = id</text>
    <text x="568" y="365">cst_key = cid</text>
  </g>
  <g fill="#334155">
    <circle cx="235" cy="252" r="3"/><circle cx="345" cy="177" r="3"/>
    <circle cx="235" cy="282" r="3"/><circle cx="345" cy="342" r="3"/>
    <circle cx="535" cy="207" r="3"/><circle cx="735" cy="187" r="3"/>
    <circle cx="535" cy="372" r="3"/><circle cx="735" cy="307" r="3"/><circle cx="735" cy="402" r="3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">Data Flow</text>
  <text x="152" y="42" font-size="15" fill="#64748b">source → bronze → silver → gold lineage</text>

  <!-- layer panels -->
  <rect x="235" y="70" width="220" height="420" rx="12" fill="#fbeee1" stroke="#c07a3a"/>
  <rect x="485" y="70" width="220" height="420" rx="12" fill="#eef1f5" stroke="#8a94a3"/>
  <rect x="750" y="70" width="220" height="420" rx="12" fill="#fdf5d6" stroke="#c9a227"/>
  <text x="345" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#8a4b14">BRONZE · raw</text>
  <text x="595" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#475569">SILVER · cleansed</text>
  <text x="860" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6d00">GOLD · star schema</text>

  <!-- sources -->
  <rect x="30" y="140" width="150" height="120" rx="10" fill="#e0ecff" stroke="#3b6fd8"/>
  <text x="105" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">CRM</text>
  <text x="105" y="214" text-anchor="middle" font-size="12" fill="#475569">3 CSV files</text>
  <rect x="30" y="310" width="150" height="120" rx="10" fill="#e0ecff" stroke="#3b6fd8"/>
  <text x="105" y="362" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">ERP</text>
  <text x="105" y="384" text-anchor="middle" font-size="12" fill="#475569">3 CSV files</text>

  <!-- source -> bronze -->
  <g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <path d="M180,200 H210 V145 H253"/>
    <path d="M180,200 H210 V195 H253"/>
    <path d="M180,200 H210 V245 H253"/>
    <path d="M180,370 H210 V315 H253"/>
    <path d="M180,370 H210 V365 H253"/>
    <path d="M180,370 H210 V415 H253"/>
  </g>

  <!-- bronze & silver tables -->
  <g font-size="14" text-anchor="middle" fill="#1f2937">
    <g fill="#ffffff" stroke="#c07a3a">
      <rect x="255" y="127" width="180" height="36" rx="6"/>
      <rect x="255" y="177" width="180" height="36" rx="6"/>
      <rect x="255" y="227" width="180" height="36" rx="6"/>
      <rect x="255" y="297" width="180" height="36" rx="6"/>
      <rect x="255" y="347" width="180" height="36" rx="6"/>
      <rect x="255" y="397" width="180" height="36" rx="6"/>
    </g>
    <g fill="#ffffff" stroke="#8a94a3">
      <rect x="505" y="127" width="180" height="36" rx="6"/>
      <rect x="505" y="177" width="180" height="36" rx="6"/>
      <rect x="505" y="227" width="180" height="36" rx="6"/>
      <rect x="505" y="297" width="180" height="36" rx="6"/>
      <rect x="505" y="347" width="180" height="36" rx="6"/>
      <rect x="505" y="397" width="180" height="36" rx="6"/>
    </g>
    <text x="345" y="150">crm_sales_details</text>
    <text x="345" y="200">crm_cust_info</text>
    <text x="345" y="250">crm_prd_info</text>
    <text x="345" y="320">erp_cust_az12</text>
    <text x="345" y="370">erp_loc_a101</text>
    <text x="345" y="420">erp_px_cat_g1v2</text>
    <text x="595" y="150">crm_sales_details</text>
    <text x="595" y="200">crm_cust_info</text>
    <text x="595" y="250">crm_prd_info</text>
    <text x="595" y="320">erp_cust_az12</text>
    <text x="595" y="370">erp_loc_a101</text>
    <text x="595" y="420">erp_px_cat_g1v2</text>
  </g>

  <!-- bronze -> silver -->
  <g fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)">
    <path d="M435,145 H503"/><path d="M435,195 H503"/><path d="M435,245 H503"/>
    <path d="M435,315 H503"/><path d="M435,365 H503"/><path d="M435,415 H503"/>
  </g>
  <text x="469" y="470" text-anchor="middle" font-size="11" fill="#64748b">clean · dedupe</text>
  <text x="469" y="484" text-anchor="middle" font-size="11" fill="#64748b">standardize</text>

  <!-- gold views -->
  <g stroke="#c9a227" stroke-width="1.5">
    <rect x="770" y="127" width="180" height="36" rx="6" fill="#fff8dc"/>
    <rect x="770" y="262" width="180" height="36" rx="6" fill="#fff8dc"/>
    <rect x="770" y="377" width="180" height="36" rx="6" fill="#fff8dc"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#5c4a00">
    <text x="860" y="150">fact_sales</text>
    <text x="860" y="285">dim_customers</text>
    <text x="860" y="400">dim_products</text>
  </g>

  <!-- silver -> gold -->
  <g fill="none" stroke-width="1.6" marker-end="url(#arr)">
    <path d="M685,145 H768" stroke="#b45309"/>
    <path d="M685,195 C730,195 725,280 768,280" stroke="#2563eb"/>
    <path d="M685,315 C730,315 725,280 768,280" stroke="#2563eb"/>
    <path d="M685,365 C730,365 725,280 768,280" stroke="#2563eb"/>
    <path d="M685,245 C735,245 720,395 768,395" stroke="#059669"/>
    <path d="M685,415 C730,415 725,395 768,395" stroke="#059669"/>
  </g>
</svg>

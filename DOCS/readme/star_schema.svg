<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#0f172a">Sales Data Mart</text>
  <text x="222" y="42" font-size="15" fill="#64748b">gold layer star schema</text>

  <!-- dim_customers -->
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="80" width="250" height="392" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="30" y="80" width="250" height="38" rx="10" fill="#fdf0c4"/>
    <text x="155" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#5c4a00">gold.dim_customers</text>
    <text x="45" y="145" font-weight="700" fill="#b45309">PK</text><text x="80" y="145" font-weight="700">customer_key</text>
    <text x="80" y="175">customer_id</text>
    <text x="80" y="205">customer_number</text>
    <text x="80" y="235">first_name</text>
    <text x="80" y="265">last_name</text>
    <text x="80" y="295">country</text>
    <text x="80" y="325">martial_status</text>
    <text x="80" y="355">gender</text>
    <text x="80" y="385">birthdate</text>
    <text x="80" y="415">create_date</text>
  </g>

  <!-- fact_sales -->
  <g font-size="13" fill="#1f2937">
    <rect x="375" y="110" width="250" height="330" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="375" y="110" width="250" height="38" rx="10" fill="#dbe7ff"/>
    <text x="500" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">gold.fact_sales</text>
    <text x="425" y="175">order_number</text>
    <text x="388" y="205" font-weight="700" fill="#2563eb">FK</text><text x="425" y="205" font-weight="700">product_key</text>
    <text x="388" y="235" font-weight="700" fill="#2563eb">FK</text><text x="425" y="235" font-weight="700">customer_key</text>
    <text x="425" y="265">order_date</text>
    <text x="425" y="295">shipping_date</text>
    <text x="425" y="325">due_date</text>
    <text x="425" y="355">sales_amount</text>
    <text x="425" y="385">quantity</text>
    <text x="425" y="415">price</text>
  </g>
  <text x="500" y="468" text-anchor="middle" font-size="12" fill="#64748b">sales_amount = quantity × price</text>

  <!-- dim_products -->
  <g font-size="13" fill="#1f2937">
    <rect x="720" y="80" width="250" height="392" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="720" y="80" width="250" height="38" rx="10" fill="#fdf0c4"/>
    <text x="845" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#5c4a00">gold.dim_products</text>
    <text x="735" y="145" font-weight="700" fill="#b45309">PK</text><text x="770" y="145" font-weight="700">product_key</text>
    <text x="770" y="175">product_id</text>
    <text x="770" y="205">product_number</text>
    <text x="770" y="235">product_name</text>
    <text x="770" y="265">category_id</text>
    <text x="770" y="295">category</text>
    <text x="770" y="325">subcategory</text>
    <text x="770" y="355">maintenance</text>
    <text x="770" y="385">cost</text>
    <text x="770" y="415">product_line</text>
    <text x="770" y="445">start_date</text>
  </g>

  <!-- relationships: 1 dim → many facts -->
  <g fill="none" stroke="#334155" stroke-width="1.6">
    <path d="M280,140 C330,140 320,230 375,230"/>
    <path d="M720,140 C670,140 680,200 625,200"/>
  </g>
  <g font-size="12" font-weight="700" fill="#334155">
    <text x="286" y="133">1</text>
    <text x="358" y="224">∞</text>
    <text x="706" y="133">1</text>
    <text x="630" y="194">∞</text>
  </g>
</svg>
